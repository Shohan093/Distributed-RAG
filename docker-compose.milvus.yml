# Optional overlay: a distributed Milvus (Wang et al., SIGMOD 2021) vector
# store, as an alternative to the FAISS-per-shard default (index/faiss_shard.py)
# once a single VM's shards stop fitting in memory (E5/E6 scale-out, PLAN.md
# §8.4 step 5). Deliberately self-contained (its own etcd + MinIO) rather
# than reusing the app's redis/minio services, so adopting Milvus is an
# additive `docker compose -f docker-compose.yml -f docker-compose.milvus.yml up`,
# never a change to the base stack.
#
# This is a documented extension point, not exercised by the local smoke
# test or the E1-E4 pilot-scale (10M) experiments, which use FAISS.
services:
  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - milvus_etcd_data:/etcd
    networks: [driftdrag]

  milvus-minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: milvusadmin
      MINIO_ROOT_PASSWORD: milvusadmin-dev-only
    command: server /minio_data --console-address ":9091"
    ports:
      - "9010:9000"
      - "9011:9091"
    volumes:
      - milvus_minio_data:/minio_data
    networks: [driftdrag]

  milvus-standalone:
    image: milvusdb/milvus:v2.4.9
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
      MINIO_ACCESS_KEY_ID: milvusadmin
      MINIO_SECRET_ACCESS_KEY: milvusadmin-dev-only
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on: [milvus-etcd, milvus-minio]
    volumes:
      - milvus_data:/var/lib/milvus
    networks: [driftdrag]

networks:
  driftdrag:
    driver: bridge

volumes:
  milvus_etcd_data:
  milvus_minio_data:
  milvus_data:
