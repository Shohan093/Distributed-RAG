---
# Provisions each VM in inventory.ini with Docker + the repo, then starts
# exactly the container profile(s) matching the groups that VM belongs to
# (see inventory.ini.example's comment and PLAN.md 8.2). Idempotent: safe to
# re-run after adding a VM to a group to scale that role out.
- name: Provision Docker + repo on every drift-drag VM
  hosts: all
  become: true
  vars:
    repo_dest: /opt/drift-drag
  tasks:
    - name: Install Docker + Compose plugin (Debian/Ubuntu)
      when: ansible_facts['os_family'] == "Debian"
      block:
        - name: Install prerequisite packages
          apt:
            name: [ca-certificates, curl, gnupg, git]
            state: present
            update_cache: true

        - name: Add Docker's official GPG key
          apt_key:
            url: https://download.docker.com/linux/ubuntu/gpg
            state: present

        - name: Add Docker apt repository
          apt_repository:
            repo: "deb https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
            state: present

        - name: Install Docker Engine + Compose plugin
          apt:
            name: [docker-ce, docker-ce-cli, containerd.io, docker-compose-plugin]
            state: present
            update_cache: true

    - name: Add ansible_user to the docker group
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true

    - name: Clone/update the drift-drag repo
      git:
        repo: "{{ repo_url }}"
        dest: "{{ repo_dest }}"
        version: "{{ repo_branch }}"

    - name: Render this VM's .env from group membership
      template:
        src: templates/env.j2
        dest: "{{ repo_dest }}/.env"
      vars:
        vm_role: "{{ group_names[0] }}"

- name: Start this VM's container profile(s)
  hosts: all
  become: true
  vars:
    repo_dest: /opt/drift-drag
  tasks:
    - name: docker compose up for every profile this host belongs to
      command: >
        docker compose -f docker-compose.yml -f docker-compose.cluster.yml
        {% for g in group_names %}--profile {{ g }} {% endfor %}up -d
      args:
        chdir: "{{ repo_dest }}"
