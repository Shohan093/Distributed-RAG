# Multi-VM profile (docker-compose.yml + docker-compose.cluster.yml, one
# role per VM -- see DEPLOYMENT.md). Structurally identical to docker.yaml;
# every endpoint now resolves to a *different VM's* advertised host/IP
# instead of "localhost", which is the only thing that changes when this
# project moves off a single machine. Set these in the deployment's .env
# (or the Ansible inventory group_vars) once per cluster, never per job.
spark:
  master: spark://${oc.env:SPARK_MASTER_HOST}:7077
  extra_conf:
    spark.jars.packages: org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.3
    spark.hadoop.fs.s3a.endpoint: http://${oc.env:MINIO_HOST}:9000
    spark.hadoop.fs.s3a.access.key: ${oc.env:MINIO_ROOT_USER}
    spark.hadoop.fs.s3a.secret.key: ${oc.env:MINIO_ROOT_PASSWORD}
    spark.hadoop.fs.s3a.path.style.access: "true"
    spark.executor.instances: ${oc.env:NUM_SPARK_EXECUTORS,4}

stream:
  source: kafka
  file_path: null
  max_files_per_trigger: null
  kafka_bootstrap_servers: ${oc.env:KAFKA_BOOTSTRAP_SERVERS}
  topic_docs: ${oc.env:KAFKA_TOPIC_DOCS,docs-raw}
  topic_logs: ${oc.env:KAFKA_TOPIC_LOGS,logs-raw}

ledger:
  backend: redis
  redis_host: ${oc.env:REDIS_HOST}
  redis_port: ${oc.env:REDIS_PORT,6379}
  history_path: /mnt/shared/ledger_history.jsonl

lake:
  root: s3a://${oc.env:MINIO_BUCKET,driftdrag-lake}

mlflow:
  tracking_uri: ${oc.env:MLFLOW_TRACKING_URI}
