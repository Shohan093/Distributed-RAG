services:
  kafka:
    image: apache/kafka:3.8.0
    hostname: kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://${VM_ADVERTISED_HOST:-localhost}:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: ${KAFKA_NUM_PARTITIONS:-8}
      CLUSTER_ID: driftdrag-kraft-cluster-1
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks: [driftdrag]

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    networks: [driftdrag]

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-driftdrag}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-driftdrag-dev-only}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks: [driftdrag]

  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-driftdrag} ${MINIO_ROOT_PASSWORD:-driftdrag-dev-only}; do sleep 2; done;
      mc mb -p local/${MINIO_BUCKET:-driftdrag-lake};
      exit 0;
      "
    networks: [driftdrag]

  spark-master:
    image: apache/spark:3.5.3-python3
    hostname: spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    ports:
      - "7077:7077"
      - "8080:8080"
    environment:
      SPARK_NO_DAEMONIZE: "true"
    networks: [driftdrag]

  spark-worker:
    image: apache/spark:3.5.3-python3
    depends_on: [spark-master]
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-2}
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-2g}
      SPARK_NO_DAEMONIZE: "true"
    deploy:
      replicas: 1
    networks: [driftdrag]

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    ports:
      - "5000:5000"
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri /mlruns --default-artifact-root /mlruns
    volumes:
      - mlflow_data:/mlruns
    networks: [driftdrag]

networks:
  driftdrag:
    driver: bridge

volumes:
  kafka_data:
  redis_data:
  minio_data:
  mlflow_data:
