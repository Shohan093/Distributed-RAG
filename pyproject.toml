[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "driftdrag"
version = "0.1.0"
description = "Drift-compensated distributed RAG for streaming analytics"
requires-python = ">=3.10"
dependencies = [
    "pyspark>=3.5,<3.6",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "pandas>=2.1",
    "pyarrow>=14.0",
    "redis>=5.0",
    "faiss-cpu>=1.7",
    "hydra-core>=1.3",
    "mlflow>=2.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "fakeredis>=2.20"]
models = ["sentence-transformers>=2.5"]

[tool.setuptools.packages.find]
where = ["src"]
